name: Deploy to ElysiaFollower.github.io

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check
        run: pnpm check

      - name: Build
        run: pnpm build

      - name: Verify production output
        run: pnpm verify:build

      - name: Get current timestamp
        run: echo "TIMESTAMP=$(date +'%Y-%m-%d %H:%M:%S')" >> $GITHUB_ENV

      - name: Deploy to ElysiaFollower.github.io
        uses: cpina/github-action-push-to-another-repository@main
        env:
          API_TOKEN_GITHUB: ${{ secrets.GH_PAT }}
        with:
          source-directory: 'dist'
          destination-repository-username: 'ElysiaFollower'
          destination-repository-name: 'ElysiaFollower.github.io'
          user-name: 'Prometheus0017'
          user-email: '1615534978@qq.com'
          target-branch: 'main'
          commit-message: 'Site updated: ${{ env.TIMESTAMP }}'
